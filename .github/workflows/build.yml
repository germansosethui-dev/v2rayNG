name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download libv2ray.aar
        run: |
          PROJECT_DIR=$(dirname $(find . -name gradlew -type f | head -1))
          mkdir -p "$PROJECT_DIR/app/libs"
          curl -L -o "$PROJECT_DIR/app/libs/libv2ray.aar" https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar

      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(dirname $(find . -name gradlew -type f | head -1))
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find . -name "*.apk" -path "*debug*" | head -1)
          echo "Найден APK: $APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Farry-VPN-debug
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
