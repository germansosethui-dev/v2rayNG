name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find project structure
        run: |
          echo "=== Файлы в корне ==="
          ls -la
          echo "=== Ищем gradlew ==="
          find . -name gradlew -type f
          echo "=== Ищем app/libs ==="
          find . -name "libs" -type d

      - name: Download libv2ray.aar
        run: |
          PROJECT_DIR=$(dirname $(find . -name gradlew -type f | head -1))
          echo "Проект в: $PROJECT_DIR"
          mkdir -p "$PROJECT_DIR/app/libs"
          curl -L -o "$PROJECT_DIR/app/libs/libv2ray.aar" https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar

      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(dirname $(find . -name gradlew -type f | head -1))
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-debug
          path: "**/build/outputs/apk/debug/*.apk"
